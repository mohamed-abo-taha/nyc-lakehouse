name: nyc-lakehouse

# Default `docker compose up -d` brings up the lake (MinIO) and the warehouse
# (Postgres). Metabase and Redpanda are behind profiles so the core stays lean:
#   docker compose --profile bi up -d        # + Metabase BI
#   docker compose --profile stream up -d    # + Redpanda (Kafka API) for streaming

services:
  minio:                       # S3-compatible object store = the data lake
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"            # S3 API
      - "9001:9001"            # web console
    volumes:
      - minio_data:/data

  postgres:                    # serving warehouse (gold marts) + CDC source
    image: postgres:16
    # logical replication so Debezium can capture changes (CDC)
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse}"]
      interval: 5s
      timeout: 3s
      retries: 12

  metabase:                    # BI dashboards on the gold marts (profile: bi)
    image: metabase/metabase:latest
    profiles: ["bi"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  redpanda:                    # Kafka-compatible broker for streaming (profile: stream)
    image: redpandadata/redpanda:latest
    profiles: ["stream"]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      # two listeners: INTERNAL for other containers, EXTERNAL for host clients
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    ports:
      - "19092:19092"

  connect:                     # Debezium (Kafka Connect) for CDC from Postgres
    image: quay.io/debezium/connect:2.7.3.Final
    profiles: ["stream"]
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: cdc-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

volumes:
  minio_data:
  pg_data:
