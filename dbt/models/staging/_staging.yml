version: 2

models:
  - name: stg_yellow_trips
    description: "Cleaned, typed yellow-taxi trips (silver). One row per trip."
    columns:
      - name: pickup_at
        description: "Trip start timestamp."
        data_tests: [not_null]
      - name: dropoff_at
        data_tests: [not_null]
      - name: pickup_zone_id
        data_tests: [not_null]
      - name: dropoff_zone_id
        data_tests: [not_null]
      - name: payment_type_id
        data_tests: [not_null]
      - name: rate_code_id
        data_tests: [not_null]
      - name: trip_distance
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_amount
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
