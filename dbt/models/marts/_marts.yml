version: 2

models:
  - name: fct_trips
    description: "Trip fact (gold). Grain: one yellow-taxi trip."
    columns:
      - name: trip_id
        description: "Surrogate key (dedup key for the natural-key-less source)."
        data_tests: [not_null, unique]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: pickup_zone_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_id
      - name: dropoff_zone_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_id
      - name: vendor_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_vendor')
                field: vendor_id
      - name: payment_type_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type_id
      - name: rate_code_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_rate_code')
                field: rate_code_id
      - name: total_amount
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: dim_date
    columns:
      - name: date_key
        data_tests: [not_null, unique]
  - name: dim_zone
    columns:
      - name: zone_id
        data_tests: [not_null, unique]
  - name: dim_vendor
    columns:
      - name: vendor_id
        data_tests: [not_null, unique]
  - name: dim_payment_type
    columns:
      - name: payment_type_id
        data_tests: [not_null, unique]
  - name: dim_rate_code
    columns:
      - name: rate_code_id
        data_tests: [not_null, unique]
